<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SporNRD v2 Test Kontrolü</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#15263b;background:#f4f7fb}*{box-sizing:border-box}body{max-width:700px;margin:auto;padding:16px}h1{font-size:24px;margin:12px 0 4px}.muted{color:#5b7189}label{display:block;margin:18px 0 4px;font-weight:700}input{width:100%;font:inherit;padding:12px;border:1px solid #bdc9d7;border-radius:10px}button{border:0;background:#125f99;color:#fff;padding:12px 17px;border-radius:10px;font:inherit;font-weight:600;margin-top:10px}button:disabled{opacity:.55}.panel{background:#fff;border:1px solid #dae2ea;border-radius:12px;margin:14px 0;padding:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{background:#edf4fa;border-radius:8px;padding:10px}.kpi b{display:block;font-size:22px}.item{border-top:1px solid #e1e7ed;padding:10px 0}.item a{color:#125f99}.badge{font-size:12px;color:#5b7189}#error{color:#ae2532;font-weight:600;white-space:pre-wrap}a{overflow-wrap:anywhere}
</style></head><body>
<h1>SporNRD · v2 Test Kontrolü</h1><div class="muted">Gerçek D1 veritabanı, 144 kaynak adayı, kategori ağacı ve canlı içerikler. Demo haber üretilmez.</div>
<label for="url">Ayrı Cloudflare test Worker adresi</label><input id="url" type="url" value="https://spornrd-v2-test.bayogrt.workers.dev" spellcheck="false"><button id="run">Canlı sistemi kontrol et</button>
<p id="error" role="alert"></p><section id="status" class="panel" aria-live="polite">Henüz sunucu sorgulanmadı. İndirdiğiniz dosyayı açmak tek başına canlı test değildir.</section><section id="cat" class="panel"></section><section id="feed" class="panel"></section>
<script>
const by=id=>document.getElementById(id);const clear=e=>{while(e.firstChild)e.removeChild(e.firstChild)};function el(tag,text,parent){const node=document.createElement(tag);node.textContent=text;parent.appendChild(node);return node}
function kpi(label,value,container){const x=el('div','',container);x.className='kpi';el('b',String(value),x);el('span',label,x)}
async function get(base,path){const c=new AbortController();const timer=setTimeout(()=>c.abort(),18000);try{const r=await fetch(base+path,{signal:c.signal,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||`HTTP ${r.status}`);return j}finally{clearTimeout(timer)}}
by('run').addEventListener('click',async()=>{const button=by('run');button.disabled=true;by('error').textContent='';const base=by('url').value.trim().replace(/\/+$/,'');if(!/^https:\/\/[^\s]+$/i.test(base)){by('error').textContent='HTTPS Worker adresi girin.';button.disabled=false;return}try{
  const status=await get(base,'/api/v2/status');clear(by('status'));el('h2','Canlı sunucu durumu',by('status'));const grid=el('div','',by('status'));grid.className='cards';kpi('D1 veritabanı',status.database,grid);kpi('Canlı içerik',status.livePosts||0,grid);kpi('Kayıt adayı (paket)',status.catalogCandidates||0,grid);kpi('Sınıflar',`${status.declaredCategories}/${status.declaredSubcategories}/${status.declaredContentTypes}`,grid);if(status.sourceStatuses?.length)el('p',status.sourceStatuses.map(x=>`${x.status}: ${x.count}`).join(' · '),by('status'));if(status.lastScan)el('p',`Son tarama: ${status.lastScan.started_at}, işlenen: ${status.lastScan.scanned}, kayıt: ${status.lastScan.published}`,by('status'));
  const taxonomy=await get(base,'/api/v2/taxonomy');clear(by('cat'));el('h2','Kategori ağacı',by('cat'));el('p',Object.entries(taxonomy.taxonomy.categories).map(([k,v])=>`${k} (${v.length} alt kategori)`).join(' · '),by('cat'));
  const feed=await get(base,'/api/v2/feed?limit=10');clear(by('feed'));el('h2',`Canlı içerikler (${feed.count})`,by('feed'));if(!feed.items.length)el('p','Henüz yayımlanmış gerçek içerik yok. Önce D1 kurulumu, kaynak başlangıç kaydı ve yetkili canlı içerik taraması gerekir.',by('feed'));
  for(const item of feed.items){const x=el('article','',by('feed'));x.className='item';el('span',`${item.category} · ${item.source_name}`,x).className='badge';el('h3',item.editorial_title,x);el('p',item.editorial_summary,x);const link=el('a','Orijinal kaynağı aç',x);link.href=item.original_url;link.target='_blank';link.rel='noopener noreferrer';el('span',' · ',x);const svg=el('a','SporNRD görsel kartı',x);svg.href=base+item.visualUrl;svg.target='_blank';svg.rel='noopener noreferrer';}
}catch(e){by('error').textContent='Canlı bağlantı doğrulanamadı: '+e.message}finally{button.disabled=false}});
</script></body></html>
